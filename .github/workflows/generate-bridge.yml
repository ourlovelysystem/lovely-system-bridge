name: Generate Bridge

on:
  push:
    branches: [main]
    paths:
      - generate_bridge.py
      - .github/workflows/generate-bridge.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate static Bridge
        run: python generate_bridge.py
      - name: Commit generated artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge.css ouch.html index.html GENERATION.txt views
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Generate static Bridge views"
          git push
