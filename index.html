<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Our Lovely System — Bridge</title><link rel="stylesheet" href="bridge.css"></head><body><main class="bridge"><section class="viewport"><div class="floorline"></div><div id="walls"></div></section><div class="crosshair"></div><div class="hud" id="hud"></div><button class="control fwd" id="fwd" aria-label="Move forward">↑</button><button class="control back" id="back" aria-label="Move backward">↓</button><button class="control left" id="left" aria-label="Move left">←</button><button class="control right" id="right" aria-label="Move right">→</button><button class="control tl1" id="tl1" aria-label="Turn 60 degrees left">↶</button><button class="control tr1" id="tr1" aria-label="Turn 60 degrees right">↷</button><button class="control bl2" id="bl2" aria-label="Turn 120 degrees left">⟲</button><button class="control br2" id="br2" aria-label="Turn 120 degrees right">⟳</button><div class="help">Movement: ↑ ↓ ← → · Turn: upper corners ±60° · lower corners ±120°</div></main><script src="bridge.js"></script></body></html>
